name: Build Android APK

on:
  push:
    branches:
      - fix/remove-claude-task-turn-cap
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build online debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testOnlineDebugUnitTest :app:assembleOnlineDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-online-debug
          path: app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: error
          retention-days: 14
